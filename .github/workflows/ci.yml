name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install linters
        run: pip install ruff black
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies (headless OpenCV, no GUI libraries needed)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip uninstall -y opencv-python
          pip install "opencv-python-headless>=4.8,<5"
      - name: Unit and integration tests with coverage
        run: pytest --cov=narrative_engine --cov-report=term-missing --cov-report=xml
      - name: Command-line smoke tests
        run: |
          narrative-engine --help
          narrative-story check
          python -m narrative_engine --help
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
